{% extends "base.html" %}
{% block title %}Entrar — Agente Natverk{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card login-angular">
    <p class="login-eyebrow">// Autenticação</p>
    <h1>Entrar</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <div class="field-group">
        <label for="password">Senha</label>
        <input class="underline-input" type="password" id="password" name="password" placeholder="••••••••" autofocus>
      </div>
      <button type="submit" class="btn-angular">
        <span>Entrar</span>
        <span class="btn-arrow">&rarr;</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
