<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agente Natverk{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="layout">
    {% if request.session.get("is_admin") %}
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">N</span>
        <span>Natverk Agente</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="{{ 'active' if request.url.path == '/admin/dashboard' else '' }}">
          <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Painel</span>
        </a>
        <a href="/admin/clients" class="{{ 'active' if request.url.path == '/admin/clients' else '' }}">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3 16c0-2.8 2.7-5 6-5s6 2.2 6 5M2 16h14M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Clientes</span>
        </a>
        <a href="/admin/audit" class="{{ 'active' if request.url.path == '/admin/audit' else '' }}">
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 3h9l3 3v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 9h7M6.5 12h7M6.5 15h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Auditoria</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <form method="post" action="/admin/logout" class="inline-form">
          <button type="submit">Sair</button>
        </form>
      </div>
    </aside>
    {% endif %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
